<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile | SyntaxSec</title>
    <meta name="description" content="Your SyntaxSec profile: account details, avatar and title.">
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
    <script>
        /* Apply the saved theme and language before first paint (no flash, no reload needed later). */
        (function () {
            var d = document.documentElement;
            try {
                d.setAttribute('data-theme', localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
                d.lang = localStorage.getItem('lang') === 'az' ? 'az' : 'en';
                d.classList.add('auth-pending');
            } catch (e) { d.setAttribute('data-theme', 'light'); }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="profile" data-access="user" data-title="profile.title">
    <main>
        <div class="wrap narrow">
            <section class="page-head">
                <h1 data-i18n="profile.h1">Your profile</h1>
                <p class="lead" data-i18n="profile.lead">Your account details and the avatar shown next to your name.</p>
            </section>

            <section class="panel" aria-labelledby="profile-name">
                <div class="profile-head">
                    <span id="profile-avatar"></span>
                    <div>
                        <h2 id="profile-name">…</h2>
                        <p class="dim small" id="profile-email"></p>
                        <p class="profile-title" id="profile-title" hidden><span class="badge"></span></p>
                    </div>
                </div>

                <h3 id="avatar-label" data-i18n="profile.avatarH">Choose an avatar</h3>
                <p class="dim small" data-i18n="profile.avatarP">Pick one of the presets, or keep the first letter of your username.</p>
                <div class="avatar-grid" id="avatar-grid" role="radiogroup" aria-labelledby="avatar-label"></div>
                <div class="row">
                    <button class="btn" id="avatar-save" type="button" data-i18n="profile.save" disabled>Save avatar</button>
                </div>
                <p class="form-msg" id="avatar-msg" role="status" aria-live="polite"></p>
            </section>

            <section class="panel" aria-labelledby="title-label" style="margin-top:22px">
                <h3 id="title-label" data-i18n="title.h">Title</h3>
                <p class="dim small" data-i18n="title.p">Titles unlock as you answer questions and keep streaks. Choose one to show next to your name.</p>
                <div class="title-list" id="title-list" role="radiogroup" aria-labelledby="title-label"><div class="skeleton"></div></div>
                <p class="form-msg" id="title-msg" role="status" aria-live="polite"></p>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="script.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
