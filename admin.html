<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - New Blog Post</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <style>
        .container { max-width: 600px; margin: 50px auto; background: var(--card); padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid var(--line); }
        h2 { margin-bottom: 20px; color: var(--ink); }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--dim); }
        input[type="text"], textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--line); border-radius: 4px; box-sizing: border-box; background: var(--bg); color: var(--ink); }
        textarea { height: 150px; resize: vertical; }
        #statusMessage { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Admin Panel: Add New Post</h2>
        
        <form id="blogForm">
            <label for="title">Article Title:</label>
            <input type="text" id="title" required placeholder="e.g., Introduction to Cybersecurity">

            <label for="tag">Topic / Tag:</label>
            <input type="text" id="tag" required placeholder="e.g., Attacks, Hygiene, Authentication">

            <label for="content">Content:</label>
            <textarea id="content" required placeholder="Write your article content here..."></textarea>

            <button type="submit" class="btn">Publish Post</button>
        </form>

        <p id="statusMessage"></p>
    </div>

    <script src="js/supabase.js"></script>
    <script src="script.js"></script>
    <script>
        document.getElementById('blogForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('title').value;
            const tag = document.getElementById('tag').value;
            const content = document.getElementById('content').value;
            const statusMessage = document.getElementById('statusMessage');

            const currentDate = new Date().toLocaleDateString('en-GB', {
                day: 'numeric',
                month: 'short',
                year: 'numeric'
            });

            const dummyAuthorId = "00000000-0000-0000-0000-000000000000"; 

            const { data, error } = await _supabase
                .from('articles')
                .insert([
                    { 
                        title: title, 
                        tag: tag,
                        content: content, 
                        date: currentDate,
                        author_id: dummyAuthorId 
                    }
                ]);

            if (error) {
                console.error('Error occurred:', error);
                statusMessage.style.color = 'var(--bad)';
                statusMessage.textContent = 'Error: ' + error.message;
            } else {
                statusMessage.style.color = 'var(--ok)';
                statusMessage.textContent = 'Article published successfully!';
                document.getElementById('blogForm').reset();
            }
        });
    </script>
</body>
</html>
