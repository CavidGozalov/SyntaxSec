<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Term | SyntaxSec</title>
    <meta name="description" content="Full explanation, practical examples and related concepts for a cybersecurity term.">
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
    <script>
        /* Apply the saved theme and language before first paint (no flash, no reload needed later). */
        (function () {
            var d = document.documentElement;
            try {
                d.setAttribute('data-theme', localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
                d.lang = localStorage.getItem('lang') === 'az' ? 'az' : 'en';
                d.classList.add('auth-pending');
            } catch (e) { d.setAttribute('data-theme', 'light'); }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="term" data-access="user" data-title="term.title">
    <main>
        <div class="wrap">
            <div class="print-only print-head"><img src="assets/icons/logo.svg" alt=""> SyntaxSec <span data-i18n="common.cheatsheet"></span></div>
            <article id="term-root" style="padding-top:34px">
                <div class="skeleton" style="min-height:120px"></div>
                <div class="skeleton" style="min-height:260px"></div>
            </article>
            <section class="section no-print" id="related-section" hidden>
                <h2 data-i18n="term.relatedH">Related terms in this topic</h2>
                <div class="grid" id="related"></div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="script.js"></script>
    <script src="js/term.js"></script>
</body>
</html>
